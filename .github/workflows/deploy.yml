name: Deploy

# Auto-deploy to the advo VPS on every push to main. Mirrors deploy.sh:
# build on the runner, rsync artifacts to /opt/fourlinq, restart pm2.
# Manual runs are available via the "Run workflow" button (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; cancel an in-flight deploy if a newer
# commit lands on main.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22 (current LTS). Was 20 — bumped 2026-07-20 because Node 20
          # is EOL April 2026 and the runner internals are already forcing v20
          # actions onto Node 24 anyway (see the deprecation warning on the
          # 07-19 deploy run). This is the app's runtime version; the internal
          # Node used by actions/checkout@v4 + actions/setup-node@v4 will
          # follow when those actions ship v5.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Quality gate — a broken build must not reach production.
      - name: Type-check
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      # The pm2 cluster entry. Built here on the runner (not committed — it is
      # a 4MB artifact) and picked up by the server/ rsync below, which is why
      # this must run BEFORE the deploy step.
      - name: Build server bundle
        run: npm run build:server

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to VPS
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          REMOTE_DIR: /opt/fourlinq
        run: |
          set -euo pipefail
          # Absolute key path ($HOME, not ~) so rsync's -e shell expands it.
          SSH="ssh -i $HOME/.ssh/id_ed25519 -o StrictHostKeyChecking=yes"

          echo "::group::Prepare remote"
          # NOTE: this used to `pm2 stop fourlinq` here. That single line was
          # the real source of deploy downtime — the app stayed stopped for the
          # whole rsync + install (measured: ~40s of 502s), and if any later
          # step failed the site simply never came back, which is how earlier
          # deploys left pm2 `stopped` with 0 restarts and an empty error log.
          # Cluster reload swaps the worker at the end; nothing needs stopping.
          $SSH "$VPS" "mkdir -p $REMOTE_DIR/logs"
          echo "::endgroup::"

          echo "::group::Sync artifacts (mirrors deploy.sh)"
          # Frontend build output. No 'docs'/'scripts' excludes here — the
          # repo folders by those names can never appear inside dist/, but
          # public/docs/ (the downloadable system catalog) legitimately
          # builds into dist/docs/ and must ship.
          rsync -az -e "$SSH" --delete \
            --exclude='node_modules' --exclude='.env' --exclude='.env.local' \
            --exclude='.git' \
            dist/ "$VPS:$REMOTE_DIR/dist/"
          # Server runtime.
          rsync -az -e "$SSH" --delete --exclude='node_modules' server/ "$VPS:$REMOTE_DIR/server/"
          # @cms-rag drop-in package used by server/ and Admin.tsx.
          rsync -az -e "$SSH" --delete --exclude='node_modules' packages/ "$VPS:$REMOTE_DIR/packages/"
          # src/data imported at runtime (tsx) for KB seeding.
          rsync -az -e "$SSH" --delete src/data/ "$VPS:$REMOTE_DIR/src/data/"
          # Snapshot the CURRENT lockfile hash before the rsync overwrites it,
          # so the install step below can tell whether dependencies changed.
          $SSH "$VPS" "md5sum $REMOTE_DIR/package-lock.json 2>/dev/null | cut -d' ' -f1" > /tmp/lock-before.md5 || echo none > /tmp/lock-before.md5
          # Manifests needed for the live-side npm ci.
          rsync -az -e "$SSH" package.json package-lock.json tsconfig.json ecosystem.config.cjs "$VPS:$REMOTE_DIR/"
          echo "::endgroup::"

          echo "::group::Write deploy audit trail"
          $SSH "$VPS" "cat > $REMOTE_DIR/deployed-from.txt" <<AUDIT
          sha:        ${{ github.sha }}
          short:      $(echo "${{ github.sha }}" | cut -c1-7)
          branch:     ${{ github.ref_name }}
          subject:    $(git log -1 --pretty=%s)
          author:     $(git log -1 --pretty='%an <%ae>')
          deployed:   $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          deployer:   github-actions (run ${{ github.run_id }})
          forced:     0
          AUDIT
          echo "::endgroup::"

          echo "::group::Install prod deps + restart"
          # tsx and typescript are RUNTIME dependencies: pm2 boots the app via
          # node_modules/tsx/dist/cli.mjs (see ecosystem.config.cjs). They are
          # in "dependencies" so --omit=dev cannot strip them.
          #
          # This step used to delete them (they were devDependencies) and then
          # re-add them with `npm install --no-save tsx@4 typescript@5`. That
          # re-install could land half-written — the tsx directory present but
          # dist/cli.mjs missing — so the app crash-looped on ERR_MODULE_NOT_FOUND
          # and the site served 502 while every step here reported success.
          # Only reinstall when the lockfile actually changed. `npm ci` DELETES
          # node_modules and rebuilds it (582 packages, ~15s), and the app is
          # still serving out of that directory the whole time — measured on
          # production, that window alone dropped requests even though the pm2
          # reload itself was clean. Most deploys change no dependencies, so
          # most deploys should not touch node_modules at all.
          LOCK_BEFORE=$(cat /tmp/lock-before.md5 2>/dev/null || echo none)
          LOCK_AFTER=$($SSH "$VPS" "md5sum $REMOTE_DIR/package-lock.json 2>/dev/null | cut -d' ' -f1" || echo unknown)
          if [ "$LOCK_BEFORE" = "$LOCK_AFTER" ] && $SSH "$VPS" "test -d $REMOTE_DIR/node_modules/express"; then
            echo "lockfile unchanged and node_modules intact — skipping npm ci"
          else
            echo "lockfile changed (or node_modules missing) — installing"
            $SSH "$VPS" "cd $REMOTE_DIR && npm ci --omit=dev --no-audit --no-fund"
          fi
          # Assert the boot entrypoint actually exists before restarting onto it.
          # A present directory is NOT proof — check the file pm2 will execute.
          $SSH "$VPS" "test -s $REMOTE_DIR/server/index.bundle.cjs || { echo 'FATAL: server bundle missing — refusing to restart'; exit 1; }"

          # RELOAD, not restart: cluster mode brings the replacement worker up
          # and waits for its `ready` signal before stopping the old one, so no
          # request is dropped. Measured on this VPS: fork restart dropped 6
          # requests under a 10/s poll, cluster reload dropped 0.
          #
          # pm2 cannot change exec_mode in place, so the first deploy after the
          # fork->cluster switch (and only that one) has to delete and start.
          $SSH "$VPS" "cd $REMOTE_DIR && \
            MODE=\$(pm2 jlist 2>/dev/null | node -e 'let s=\"\";process.stdin.on(\"data\",d=>s+=d).on(\"end\",()=>{let l=[];try{l=JSON.parse(s||\"[]\")}catch{};const a=l.find(p=>p.name===\"fourlinq\");console.log(a?a.pm2_env.exec_mode:\"none\")})') && \
            echo \"current exec_mode: \$MODE\" && \
            if [ \"\$MODE\" = 'cluster_mode' ]; then \
              pm2 reload ecosystem.config.cjs --update-env; \
            else \
              echo 'switching to cluster mode (one-time restart)'; \
              pm2 delete fourlinq >/dev/null 2>&1 || true; \
              pm2 start ecosystem.config.cjs; \
            fi && pm2 save"
          echo "::endgroup::"

          echo "::group::Health check"
          # scripts/verify-deploy.sh requires consecutive successes AND a pm2
          # restart counter that stops climbing, so a boot loop fails the deploy
          # instead of hiding inside it. Piped in rather than rsynced because
          # scripts/ is excluded from the deploy payload above.
          $SSH "$VPS" bash -s < scripts/verify-deploy.sh
          echo "::endgroup::"

          echo "Deployed ${{ github.sha }} → https://fourlinq.ph"
