name: Sync CMS data

# Applies pending DB migrations and upserts the pushed static content into the
# production CMS tables on the VPS, so the DB (which the live site reads via
# /api/cms/* and /api/project-images) matches src/data/* and server/migrations/*.
#
#   migration 014          project_image_override table (guarded: applied only
#                          if the table does not exist yet)
#   migration 015          expands override_type CHECK constraint with 6 new
#                          values (project_flagged, project_hidden, project_deleted,
#                          project_ratio, score_override, image_flagged); guarded
#                          by absence of 'project_flagged' in the constraint def
#   migrate-cms-data.ts    src/data/projects.ts + whats-new.ts
#                          -> cms_project, cms_news_post, cms_media_asset
#   sync-product-content.ts src/data/products.ts display fields
#                          -> product (name, thumbnail, copy) — non-destructive
#
# The content scripts are idempotent (upsert / update-in-place by slug). The VPS
# already has the latest src/data/ + server/ from the Deploy workflow's rsync,
# and tsx is a runtime dependency there, so this runs in place against the
# production .env / DATABASE_URL. Migrations here are applied by hand (no
# runner), so this workflow is the SSH path for that.
#
# Manual trigger only — a DB migration / content sync is a deliberate action.
on:
  workflow_dispatch:

concurrency:
  group: sync-cms-production
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Apply migrations + sync content on the VPS
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/id_ed25519 -o StrictHostKeyChecking=yes"
          $SSH "$VPS" bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/fourlinq

          echo "--- deployed revision on the VPS ---"
          head -3 deployed-from.txt 2>/dev/null || echo "(no audit file)"

          echo "--- migration 014: project_image_override ---"
          if [ -z "$(sudo -u postgres psql fourlinq -tAc "SELECT to_regclass('public.project_image_override')")" ]; then
            echo "table missing — applying 014_project_image_overrides.sql"
            sudo -u postgres psql fourlinq -v ON_ERROR_STOP=1 -f server/migrations/014_project_image_overrides.sql
          else
            echo "project_image_override already exists — skipping."
          fi

          echo "--- migration 015: expand override_type CHECK constraint ---"
          if [ -z "$(sudo -u postgres psql fourlinq -tAc "SELECT 1 FROM pg_constraint WHERE conrelid='public.project_image_override'::regclass AND contype='c' AND pg_get_constraintdef(oid) LIKE '%project_flagged%'")" ]; then
            echo "constraint missing project_flagged — applying 015_project_override_types.sql"
            sudo -u postgres psql fourlinq -v ON_ERROR_STOP=1 -f server/migrations/015_project_override_types.sql
          else
            echo "override_type constraint already includes project_flagged — skipping."
          fi

          echo "--- migration 016: add project_checked to override_type CHECK constraint ---"
          if [ -z "$(sudo -u postgres psql fourlinq -tAc "SELECT 1 FROM pg_constraint WHERE conrelid='public.project_image_override'::regclass AND contype='c' AND pg_get_constraintdef(oid) LIKE '%project_checked%'")" ]; then
            echo "constraint missing project_checked — applying 016_project_checked.sql"
            sudo -u postgres psql fourlinq -v ON_ERROR_STOP=1 -f server/migrations/016_project_checked.sql
          else
            echo "override_type constraint already includes project_checked — skipping."
          fi

          echo "--- migrate-cms-data (projects + news) ---"
          ./node_modules/.bin/tsx server/scripts/migrate-cms-data.ts

          echo "--- sync-product-content (product display fields) ---"
          ./node_modules/.bin/tsx server/scripts/sync-product-content.ts

          echo "Done: migrations applied and content synced against production."
          REMOTE
