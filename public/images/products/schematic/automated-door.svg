  <path d="M 800 700 A 240 240 0 0 0 1040 460" fill="none" stroke="#242424" stroke-width="3" stroke-dasharray="12 8" opacity="0.5"/>
  <polygon points="1032,472 1048,458 1032,444" fill="#242424" opacity="0.5"/>
