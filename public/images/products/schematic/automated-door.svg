  <circle cx="864" cy="466" r="6" fill="#242424"/>
  <circle cx="892" cy="466" r="6" fill="#242424"/>
  <!-- Lever handle -->
  <rect x="756" y="446" width="60" height="12" rx="6" fill="#242424"/>
