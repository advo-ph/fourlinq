name: Sync CMS data

# Upserts the pushed static content into the production CMS tables on the VPS,
# so the DB (which the live site reads via /api/cms/*) matches src/data/*.
#
#   migrate-cms-data.ts    src/data/projects.ts + whats-new.ts
#                          -> cms_project, cms_news_post, cms_media_asset
#   sync-product-content.ts src/data/products.ts display fields
#                          -> product (name, thumbnail, copy) — non-destructive
#
# Both scripts are idempotent (upsert / update-in-place by slug). The VPS
# already has the latest src/data/ from the Deploy workflow's rsync, and tsx is
# a runtime dependency there, so this runs the scripts in place against the
# production .env / DATABASE_URL.
#
# Manual trigger only — a DB content sync is a deliberate, observable action.
on:
  workflow_dispatch:

concurrency:
  group: sync-cms-production
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync CMS + product content on the VPS
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          REMOTE_DIR: /opt/fourlinq
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/id_ed25519 -o StrictHostKeyChecking=yes"

          echo "::group::Deployed revision on the VPS"
          $SSH "$VPS" "head -3 $REMOTE_DIR/deployed-from.txt 2>/dev/null || echo '(no audit file)'"
          echo "::endgroup::"

          echo "::group::migrate-cms-data (projects + news)"
          $SSH "$VPS" "cd $REMOTE_DIR && ./node_modules/.bin/tsx server/scripts/migrate-cms-data.ts"
          echo "::endgroup::"

          echo "::group::sync-product-content (product display fields)"
          $SSH "$VPS" "cd $REMOTE_DIR && ./node_modules/.bin/tsx server/scripts/sync-product-content.ts"
          echo "::endgroup::"

          echo "CMS data synced against production."
